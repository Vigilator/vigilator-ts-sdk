name: release-main

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-bun-env

      - name: Export tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/*/} >> $GITHUB_OUTPUT

      # The tag (in the form `*.*.*`, no `v` prefix) is the source of truth
      # for the published version.
      - name: Update package version
        run: npm version --no-git-tag-version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}

      - name: Check, test and build
        run: bun run ci && bun run typecheck && bun run test && bun run build

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
